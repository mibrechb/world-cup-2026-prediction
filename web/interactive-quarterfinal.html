<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Cup 2026 Predictions for SRF Tippspiel</title>

  <style>
    :root {
      --page-bg: #eef3f8;
      --panel-bg: rgba(255, 255, 255, 0.9);
      --panel-border: rgba(148, 163, 184, 0.28);
      --text: #0f172a;
      --muted: #475569;
      --accent: #0f766e;
      --team-a: #1a9850;
      --team-b: #d73027;
      --draw: #6b7280;
      --selection: #4b5563;
      --hover-row: rgba(15, 118, 110, 0.18);
      --hover-col: rgba(15, 23, 42, 0.14);
      --shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, #dbeafe 0%, #eef3f8 35%, #f8fafc 100%);
    }
    a { color: var(--accent); }
    .shell {
      max-width: 1360px;
      margin: 0 auto;
      padding: 28px 20px 36px 20px;
    }
    .section-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }
    .detail-section {
      display: grid;
      gap: 18px;
      padding: 22px;
      margin-bottom: 18px;
    }
    .section-intro {
      display: grid;
      gap: 8px;
    }
    .section-intro h3 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -0.03em;
    }
    .section-intro p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }
    .selection-heading {
      display: grid;
      gap: 10px;
    }
    .selection-heading h2 {
      margin: 0;
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1.02;
      letter-spacing: -0.045em;
      font-weight: 850;
    }
    .selection-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .matchup-title {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      font-size: clamp(24px, 2.2vw, 34px);
      line-height: 1.12;
      letter-spacing: -0.03em;
    }
    .matchup-team {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      color: var(--text);
    }
    .matchup-versus {
      font-style: italic;
      font-weight: 600;
      color: var(--muted);
    }
    .flag-icon {
      width: 34px;
      height: 25px;
      object-fit: cover;
      border-radius: 4px;
      box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.35);
      background: rgba(255,255,255,0.9);
      vertical-align: middle;
      flex: 0 0 auto;
    }
    .selector-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .selector-label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .selector-label select {
      appearance: none;
      border: 1px solid rgba(100, 116, 139, 0.38);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(241, 245, 249, 0.98) 0%, rgba(226, 232, 240, 0.92) 100%);
      color: var(--text);
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.55), 0 8px 20px rgba(148, 163, 184, 0.12);
    }
    .summary-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .summary-card {
      padding: 14px 16px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(248, 250, 252, 0.95) 0%, rgba(241, 245, 249, 0.95) 100%);
      border: 1px solid rgba(148, 163, 184, 0.20);
    }
    .summary-card span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .summary-card strong {
      display: block;
      margin-top: 8px;
      font-size: clamp(18px, 1.8vw, 26px);
      line-height: 1.15;
      letter-spacing: -0.03em;
    }
    .chart-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .chart-card {
      border-radius: 20px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(255, 255, 255, 0.94);
      overflow: hidden;
      min-height: 340px;
    }
    .detail-chart {
      width: 100%;
      height: 100%;
      min-height: 340px;
    }
    .matrix-section {
      padding: 18px 18px 12px 18px;
      display: grid;
      gap: 12px;
    }
    .matrix-section h3 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -0.03em;
    }
    .matrix-section p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }
    #matrix-chart {
      width: 100%;
      height: min(84vw, 980px);
      min-height: 520px;
    }
    @media (max-width: 900px) {
      .shell { padding: 18px 14px 28px 14px; }
      .selector-row, .summary-strip, .chart-grid { grid-template-columns: 1fr; }
      #matrix-chart { height: min(112vw, 720px); min-height: 420px; }
    }
  </style>
</head>

    function matchupExists(teamA, teamB) {

    function normalizeScheduledMatch(match) {
      if (!match) return null;

      if (matchupExists(match.team_a, match.team_b)) {
        return { teamA: match.team_a, teamB: match.team_b };
      }

      if (matchupExists(match.team_b, match.team_a)) {
        return { teamA: match.team_b, teamB: match.team_a };
      }

      return null;
    }

    function resolveDefaultMatch() {
      const fallback = { teamA: defaultTeamA, teamB: defaultTeamB };
      const now = new Date();
      const validMatches = defaultMatchSchedule
        .map(match => ({
          match,
          normalizedMatch: normalizeScheduledMatch(match),
          kickoffTime: new Date(match.kickoff_at).getTime()
        }))
        .filter(item => item.normalizedMatch && !Number.isNaN(item.kickoffTime))
        .sort((left, right) => left.kickoffTime - right.kickoffTime);

      if (validMatches.length === 0) return fallback;

      const nextMatch = validMatches.find(item => item.kickoffTime >= now.getTime());
      return (nextMatch || validMatches[validMatches.length - 1]).normalizedMatch;

        hovertemplate: '%{y}: %{x:.1f}%<extra></extra>'
      }], Object.assign(baseBarLayout('Most Common Scores'), {
        xaxis: { title: 'Probability (%)', gridcolor: GRID_COLOR, zeroline: false },
        yaxis: { title: '', autorange: 'reversed', zeroline: false }
      }), { responsive: true, displayModeBar: false });

      Plotly.react('outcomes-chart', [{
        type: 'bar',
        orientation: 'h',
        x: payload.outcomes.map(item => item.probability_percent),
        y: payload.outcomes.map(item => item.outcome),
        marker: { color: payload.outcomes.map(item => outcomeColor(item.outcome, teamA, teamB)) },
        hovertemplate: '%{y}: %{x:.1f}%<extra></extra>'
      }], Object.assign(baseBarLayout('Outcome Distribution'), {
        xaxis: { title: 'Probability (%)', gridcolor: GRID_COLOR, zeroline: false },
        yaxis: { title: '', autorange: 'reversed', zeroline: false }
      }), { responsive: true, displayModeBar: false });

      Plotly.react('tips-chart', [{
        type: 'bar',
        orientation: 'h',
        x: payload.tips.map(item => item.expected_points),
        y: payload.tips.map(item => item.tip),
        marker: { color: payload.tips.map(item => tipColor(item)) },
        hovertemplate: 'Tip %{y}<br>Expected points: %{x:.2f}<extra></extra>'
      }], Object.assign(baseBarLayout('Best Tips by Expected Points (SRF Tippspiel)'), {
        xaxis: { title: 'Expected Points', gridcolor: GRID_COLOR, zeroline: false },
        yaxis: { title: '', autorange: 'reversed', zeroline: false }
      }), { responsive: true, displayModeBar: false });

      Plotly.react('goal-diff-chart', [{
        type: 'bar',
        x: payload.goal_diffs.map(item => item.goal_diff),
        y: payload.goal_diffs.map(item => item.probability_percent),
        marker: { color: payload.goal_diffs.map(item => goalDiffColor(item.goal_diff)) },
        hovertemplate: 'Goal difference %{x}<br>Probability: %{y:.1f}%<extra></extra>'
      }], Object.assign(baseBarLayout('Goal-Difference Distribution'), {
        xaxis: { title: `Goal Difference (${teamA} - ${teamB})`, zeroline: false },
        yaxis: { title: 'Probability (%)', gridcolor: GRID_COLOR, zeroline: false }
      }), { responsive: true, displayModeBar: false });
    }

    document.getElementById('team-a-select').addEventListener('change', event => {
      currentTeamA = event.target.value;
      ensureDistinctSelection('a');
      renderDetail(currentTeamA, currentTeamB);
    });

    document.getElementById('team-b-select').addEventListener('change', event => {
      currentTeamB = event.target.value;
      ensureDistinctSelection('b');
      renderDetail(currentTeamA, currentTeamB);
    });

    function bindMatrixEvents() {
      const matrixChart = document.getElementById('matrix-chart');
      if (!matrixChart || !matrixChart.on) return;

      matrixChart.removeAllListeners('plotly_click');
      matrixChart.removeAllListeners('plotly_hover');
      matrixChart.removeAllListeners('plotly_unhover');

      matrixChart.on('plotly_click', eventData => {
        if (!eventData || !eventData.points || eventData.points.length === 0) return;
        const point = eventData.points[0];
        const teamB = point.x;
        const teamA = point.y;
        if (teamA === teamB) return;
        renderDetail(teamA, teamB);
      });

      matrixChart.on('plotly_hover', eventData => {
        if (!eventData || !eventData.points || eventData.points.length === 0) return;
        const point = eventData.points[0];
        if (point.x === point.y) return;
        hoverTeamA = point.y;
        hoverTeamB = point.x;
        refreshMatrixShapes();
      });

      matrixChart.on('plotly_unhover', () => {
        hoverTeamA = null;
        hoverTeamB = null;
        refreshMatrixShapes();
      });
    }

    populateSelectors();
    renderDetail(currentTeamA, currentTeamB, false);
  </script>
</body>
</html>
